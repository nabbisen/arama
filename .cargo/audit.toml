[advisories]
# Task 049: the two quick-xml advisories (RUSTSEC-2026-0194/0195) this
# comment used to explain are resolved, not ignored - wayland-scanner
# 0.31.11 (published 2026-07-22) accepts quick-xml >=0.41.0, so
# `cargo update -p wayland-scanner` closes both. See
# rfcs/notes/audit-warning-burn-down.md's "Resolved" section for the
# before/after and the full timeline (the fix was available for over
# two months before anyone revisited the ignore that named the exact
# condition that would retire it).
#
# Task 044: three of these IDs (originally four - RUSTSEC-2025-0141,
# `bincode`, retired by Task 067; see "Resolved" in the ledger) are
# `cargo audit` *warnings* (unmaintained/unsound), each tracked
# deliberately with its own dependency path, rationale, and revisit
# condition in
# rfcs/notes/audit-warning-burn-down.md's "Remaining Warnings" section -
# not ignored blindly. Listing them here by identity is what lets CI run
# `cargo audit --deny warnings` and go red on a genuinely *new* advisory
# while staying green on these tracked ones. Keep this list and that
# ledger section in sync: an identity removed from one without the other
# either leaves CI silently green on something no longer tracked, or
# fails CI on something the ledger still explains. A resolved warning's
# ID may stay listed here harmlessly (cargo audit does not complain
# about an ignore that no longer matches anything) until its ledger entry
# is moved to "Resolved" and this entry is removed in the same change.
#
# Task 059: the IDs below follow the same convention - each has its
# full dependency-path evidence and revisit condition in
# rfcs/notes/audit-warning-burn-down.md's "Remaining Warnings" section,
# not just here. Two groups (a third, quinn-proto x5, was retired by
# Task 072 - see that task's comment below):
#   - zip x3 (0367-0369, each matching both zip 7.2.0 and 8.6.0 in the
#     lock - one ID ignored here covers every version it matches): a
#     real but upstream-blocked path through candle-core, and confirmed
#     not to reach the vulnerable `extract()` function at all - arama's
#     model path only reads zip entries via `by_name()`.
#   - zvariant/zbus_names/zvariant_derive x3 (0370-0372): unmaintained,
#     merged into zbus 6.0.0, which neither of the two crates that pull
#     these in has adopted yet.
#
# Task 065: RUSTSEC-2026-0429 (one identity, matching both zip 7.2.0 and
# 8.6.0 in the lock) is the same `ZipArchive::extract()` family of
# functions Task 059 already determined unreachable for RUSTSEC-2026-
# 0367/0368/0369 above - candle-core is still the only zip consumer in
# either version, confirmed again rather than assumed, and it never
# calls extract(). Revisit condition: candle-core depending on
# zip >=9.0.0, the version that patches it.
#
# Task 067: RUSTSEC-2025-0141 (bincode 2.0.1) is retired, not listed
# below any more - `localcache` 0.26.2 dropped `bincode` entirely
# (`grep -c '^name = "bincode"$' Cargo.lock` -> 0). This is the semver-
# major-upgrade retirement RFC 049 S4.1 says no automated detector can
# see; see the ledger's "Resolved" section for the before/after.
#
# Task 072: RUSTSEC-2026-0338 through 0342 (quinn-proto 0.11.15,
# unreachable - see Task 059's comment above, now historical) are
# retired, not listed below any more - `cargo update -p quinn-proto`
# moved the lock to 0.11.19, which also happens to fix RUSTSEC-2026-
# 0523/0524 (never ignored - they were new, not pre-existing warnings,
# so the update closed them outright rather than retiring a suppression
# for them). Confirmed per ID: `cargo audit --deny warnings` exits 0
# with all five removed from this list, not merely silenced. See the
# ledger's "Resolved" section for the before/after.
#
# Task 068: RUSTSEC-2026-0441 (pin-utils 0.1.0) is in the lockfile but
# in no binary arama ships - it reaches us only via
# wasmtimer <- iced_futures, gated behind
# `[target.'cfg(target_arch = "wasm32")'.dependencies.wasmtimer]` in
# iced_futures 0.14.0's own manifest, and arama ships no wasm32 build
# (five release variants: Linux x2, Windows x2, macOS). Confirmed per
# target with `cargo tree -i pin-utils --target <t> -e normal,build`:
# nothing to print for x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc,
# or aarch64-apple-darwin; a real path only for wasm32-unknown-unknown.
# Same shape as `quinn-proto` above (RUSTSEC-2026-0338/etc.) - absent
# from every shipped binary - but reached by a different route: that
# one is an optional feature never enabled, this one is a target never
# built. Revisit condition: that same per-target `cargo tree` command
# printing a path for linux-gnu, windows-msvc, or apple-darwin - not
# "when upstream fixes it".
ignore = [
    "RUSTSEC-2024-0436", # paste 1.0.15, unmaintained - candle/gemm, tokenizers, Apple rendering.
    "RUSTSEC-2026-0192", # ttf-parser 0.25.1, unmaintained - fontdb, cosmic-text, ab_glyph.
    "RUSTSEC-2026-0253", # lru 0.16.4, unsound - cryoglyph <- iced_wgpu <- iced.
    "RUSTSEC-2026-0367", # zip 7.2.0/8.6.0, extract() not called - candle-core <- pt2safetensors/arama-ai.
    "RUSTSEC-2026-0368", # zip 7.2.0/8.6.0, extract() not called - candle-core <- pt2safetensors/arama-ai.
    "RUSTSEC-2026-0369", # zip 7.2.0/8.6.0, extract() not called - candle-core <- pt2safetensors/arama-ai.
    "RUSTSEC-2026-0370", # zvariant 5.12.0, unmaintained - zbus 5.16.0 <- file-handle/mundy.
    "RUSTSEC-2026-0371", # zbus_names 4.3.2, unmaintained - zbus 5.16.0 <- file-handle.
    "RUSTSEC-2026-0372", # zvariant_derive 5.12.0, unmaintained - zbus 5.16.0 <- file-handle/mundy.
    "RUSTSEC-2026-0429", # zip 7.2.0/8.6.0, extract() not called - candle-core <- pt2safetensors/arama-ai. Same path as 0367-0369.
    "RUSTSEC-2026-0441", # pin-utils 0.1.0, unmaintained - wasmtimer <- iced_futures, wasm32-only, no wasm32 build shipped.
]
