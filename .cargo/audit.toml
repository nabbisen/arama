    "RUSTSEC-2026-0369", # zip 7.2.0, extract() not called - candle-core 0.10.2 <- pt2safetensors <- arama-ai. zip 8.6.0 half retired by T080.
    "RUSTSEC-2026-0370", # zvariant 5.12.0, unmaintained - zbus 5.16.0 <- file-handle/mundy.
