[package]
name        = "arama"
description = "Image / video viewer and similarity finder powered by offline AI"
readme      = "../README.md"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
authors.workspace       = true
license.workspace       = true
repository.workspace    = true
categories.workspace    = true
keywords.workspace      = true

[dependencies]
arama-ai                    = { workspace = true }
arama-cache                 = { workspace = true }
arama-i18n                  = { workspace = true }
arama-theme                 = { workspace = true }
arama-env                   = { workspace = true }
arama-sidecar               = { workspace = true }
arama-ui-layout             = { workspace = true }
arama-ui-main               = { workspace = true }
arama-ui-widgets            = { workspace = true }

iced                        = { workspace = true }

anyhow                      = { workspace = true }
app-json-settings           = { workspace = true }
file-handle                 = { workspace = true }
lucide-icons                = { workspace = true }
rfd                         = { workspace = true }
rayon                       = { workspace = true }
swdir                       = { workspace = true }
snora                       = { workspace = true }
# `tokio::task::spawn_blocking` (RFC 047 S3.1) - no extra features listed
# here, matching `arama-ai`'s own `{ workspace = true }` line: `rt` and
# `rt-multi-thread` are already pulled into the one shared `tokio` build
# by `iced`'s own `features = ["tokio"]` request (`iced_futures`'s
# `tokio` optional dependency), and Cargo unifies features across every
# crate that depends on the same `tokio` in one build.
tokio                       = { workspace = true }

[dev-dependencies]
iced_test                   = "0.14"
# T074 Phase 0: decodes the PNG `iced_test::Snapshot::matches_image`
# writes to a scratch path, to inspect specific pixels for a non-clipping
# overflow check - already in Cargo.lock (iced_test uses it internally for
# the same comparison), so this adds a usage edge, not a new package.
png                         = "0.18"
