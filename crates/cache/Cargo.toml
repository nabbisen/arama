[package]
name        = "arama-cache"
description = "Embedding and thumbnail cache facade over localcache for arama"
readme      = "../../README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
categories.workspace   = true
keywords.workspace     = true

# Integration tests are split across named files; disable autodiscovery so
# that helpers.rs (a shared fixture, not a test binary) is not picked up.
autotests = false

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "image"
path = "tests/image.rs"

[[test]]
name = "video"
path = "tests/video.rs"

[[test]]
name = "cross"
path = "tests/cross.rs"

[[test]]
name = "maintenance"
path = "tests/maintenance.rs"

[dependencies]
localcache = { workspace = true }

anyhow = { workspace = true }
blake3 = { workspace = true }
# Review 161 #4: `run_command_with_timeout` (thumbnail.rs) kills the whole
# process group on timeout, not just the one child - already a workspace
# dependency, used the same way by the sidecar for Task 021's Windows
# process-tree reaping. No new crate in the lockfile.
command-group = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
