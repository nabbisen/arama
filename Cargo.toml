[workspace]
resolver = "3"
members = [
    "app",
    "crates/ai",
    "crates/cache",
    "crates/i18n",
    "crates/theme",
    "crates/engine/sidecar",
    "crates/ui/layout",
    "crates/ui/main",
    "crates/ui/widgets",
    "env",
]

[workspace.package]
version = "0.41.0"
edition         = "2024"
rust-version    = "1.91"
license         = "Apache-2.0"
authors         = ["nabbisen"]
categories      = ["gui"]
keywords        = ["image", "walk", "filter"]
repository      = "https://github.com/nabbisen/arama"

[workspace.dependencies]
arama-ai            = { version = "0", path = "crates/ai" }
arama-cache         = { version = "0", path = "crates/cache" }
arama-env           = { version = "0", path = "env" }
arama-i18n          = { version = "0", path = "crates/i18n" }
arama-sidecar       = { version = "0", path = "crates/engine/sidecar" }
arama-theme         = { version = "0", path = "crates/theme" }
arama-ui-layout     = { version = "0", path = "crates/ui/layout" }
arama-ui-main       = { version = "0", path = "crates/ui/main" }
arama-ui-widgets    = { version = "0", path = "crates/ui/widgets" }

# UI
iced                = { version = "0.14", features = ["image-without-codecs", "tokio"] }
snora               = { version = "0.39", default-features = false, features = ["design"] }

# app control
app-json-settings   = "2"
directories         = "6"
disk-space          = "0"
file-handle         = { version = "0", features = ["open", "show", "trash"] }
iced-swdir-tree     = { version = "0.9", features = ["icons"] }
lucide-icons        = { version = "1", features = ["iced"] }
rfd                 = "0.17"
swdir               = "0"
webbrowser          = "1"

# general
anyhow              = "1"
chrono              = { version = "0.4", default-features = false, features = ["clock"] }
command-group       = "5"
image               = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "rayon", "webp"] }
libc                = "0.2"
rayon               = "1"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
sha2                = "0.10"
thiserror           = "2"
tokio               = { version = "1.49", default-features = false, features = ["fs", "sync"] }
# Task 036: adapts `ModelContainer::download_with_progress`'s
# `tokio::sync::watch::Receiver` into a `Stream` for `iced::Task::run` -
# not a new dependency tree, `tokio-stream` is a thin, official Tokio
# crate with no transitive additions beyond `tokio`/`futures-core`,
# both already present.
tokio-stream        = { version = "0.1", default-features = false, features = ["sync"] }

# ai
# candle series is defined in sub-crate because virtual manifest doesn't support [target] (os-specific) sections
# - calc
naga                = "27"
# - model loader
reqwest             = { version = "0.13", default-features = false, features = ["blocking", "multipart", "rustls", "stream"] }
pt2safetensors      = "0.1.3"

# cache
localcache          = "0.21"
blake3              = "1"

# tests
tempfile            = "3"

[profile.release]           # shrink executable size
opt-level       = "z"
lto             = true
# panic         = "abort"
strip           = true
codegen-units   = 1

[profile.dev]               # to improve productivity
opt-level       = 1         # slightly optimize
lto             = false     # disable link-time optimizations
incremental     = false
