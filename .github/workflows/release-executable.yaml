name: Executable

# RFC 034 (release workflow reliability): a tag push triggers the workflow,
# which creates the release itself, rather than reacting to a release event.
# This removes three of the four failure modes that produced a published
# 0.37.0 release with no executable assets and no workflow run at all: cause
# 1 (`created` not firing for an already-published release), cause 2 (a
# trigger change not yet live when the release fires), and cause 3
# (`workflow_dispatch` resolving against the dispatched ref, so a fallback
# added after a tag exists cannot rescue that tag's release).
#
# The owner decided nothing is published until every asset variant has
# succeeded, so the `release` job depends on both `build` and
# `source-archive` and only creates anything once both have fully succeeded.
# A failed variant therefore leaves the tag with no release — visible and
# recoverable — rather than a published release missing assets.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # Manual fallback and Part C's pre-tag verification: dispatched against a
  # branch, `github.ref_type` is `branch`, so the `source-archive` and
  # `release` jobs (both gated on `github.ref_type == 'tag'`) do not run.
  # This proves all five variants build before the irreversible tag push,
  # without attempting to create or upload anything.
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PRODUCT_BASENAME: arama
  TAG: ${{ github.ref_name }}            # tag or branch name
  JOB_WORKDIR: tmp-${{ github.run_id }}  # unique number
  # Task 011: the windows-latest runner's MSVC toolset requires CUDA 13.2
  # or newer (candle-kernels' build script failed with STL1002 at 13.1.0).
  # Raising this also required raising the Jimver/cuda-toolkit pin below,
  # since the previously pinned action version did not offer 13.2.x.
  CUDA_VERSION: '13.2.2'
  CUDA_COMPUTE_CAPS: 86
  # 5 executable variants (the build matrix) + 1 contract-compliant source
  # archive (the source-archive job). Part D: "all variants built" and "all
  # assets attached" are different claims, so this is checked explicitly
  # after upload rather than inferred from job success.
  EXPECTED_ASSET_COUNT: 6

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every variant report rather than cancelling the rest on the
      # first failure. The gate is the `release` job's `needs:`
      # relationship, not matrix cancellation — under the required order a
      # failure now costs a whole tag-and-retry cycle, so seeing every
      # broken variant in one run turns three retries into one.
      fail-fast: false
      matrix:
        include:
          - name: Linux-x64-gnu-cpu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin-ext:
            archive-ext: .tar.gz
            cuda_enabled: false
          - name: Linux-x64-gnu-gpu-cuda
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin-ext:
            archive-ext: .tar.gz
            cuda_enabled: true
          - name: macOS-aarch64
            target: aarch64-apple-darwin
            os: macos-latest
            bin-ext:
            archive-ext: .zip
            cuda_enabled: false
          - name: Windows-x64-cpu
            target: x86_64-pc-windows-msvc
            os: windows-latest
            bin-ext: .exe
            archive-ext: .zip
            cuda_enabled: false
          - name: Windows-x64-gpu-cuda
            target: x86_64-pc-windows-msvc
            os: windows-latest
            bin-ext: .exe
            archive-ext: .zip
            cuda_enabled: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify manifest version matches the tag
        # Only meaningful for an actual tag push — under workflow_dispatch
        # against a branch, `env.TAG` is the branch name, which correctly
        # never matches a version and would otherwise always fail Part C's
        # build-only verification.
        if: github.ref_type == 'tag'
        run: |
          # Part F: the tag is the version. A 0.38.0 tag against a 0.37.0
          # manifest ships binaries that report the wrong version just as
          # surely as a mismatched candidate tag would — fail fast here
          # rather than shipping the mismatch.
          MANIFEST_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]*)".*/\1/')
          if [ "${MANIFEST_VERSION}" != "${{ env.TAG }}" ]; then
            echo "::error::[workspace.package].version (${MANIFEST_VERSION}) does not match the tag (${{ env.TAG }})"
            exit 1
          fi

      - name: Cache cargo dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # [ cuda setup ]
      # linux and windows
      - name: cuda toolkit setup
        if: matrix.cuda_enabled == true
        # v0.2.36 - b8bf9c6 (Task 011: v0.2.30 did not offer CUDA 13.2.x)
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: 'network'
      - name: Mitigate nvidia-smi panic
        if: matrix.cuda_enabled == true
        run: |
          echo "CUDA_COMPUTE_CAP=${{ env.CUDA_COMPUTE_CAPS }}" >> $GITHUB_ENV

      # windows only
      - name: Setup MSVC Environment
        if: runner.os == 'Windows' && matrix.cuda_enabled == true
        shell: pwsh
        run: |
          $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest `
              -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          $toolsPath = Get-ChildItem "$installPath\VC\Tools\MSVC" |
              Sort-Object Name -Descending |
              Select-Object -First 1
          $binPath = Join-Path $toolsPath.FullName "bin\Hostx64\x64"
          if (Test-Path $binPath) {
              echo "$binPath" >> $env:GITHUB_PATH
              echo "NVCC_CCBIN=$binPath\cl.exe" >> $env:GITHUB_ENV
              echo "Added to PATH: $binPath"
          } else {
              throw "MSVC Bin path not found"
          }

          # Task 011 phase 2: CUDA 13.2's cccl headers hard-require MSVC's
          # standard-conforming preprocessor and #error out under the
          # traditional one. -Xcompiler forwards the flag from nvcc to
          # cl.exe; NVCC_APPEND_FLAGS is read directly by nvcc, so this
          # needs no candle-kernels/cudarc patch.
          echo "NVCC_APPEND_FLAGS=-Xcompiler /Zc:preprocessor" >> $env:GITHUB_ENV

      # [ build ]
      - name: Install Rust
        run: bash .github/workflows/scripts/install-rust.sh stable ${{ matrix.target }}

      - name: Build Rust executable
        run: |
          cargo build --release --target ${{ matrix.target }} --bin ${{ env.PRODUCT_BASENAME }} --locked \
              ${{ matrix.cuda_enabled == true && '--features cuda' || '' }}

      # [ release asset ]
      - name: Prepare for release asset
        run: |
          BUILT_FILE_PATH=target/${{ matrix.target }}/release/${{ env.PRODUCT_BASENAME }}${{ matrix.bin-ext }}
          RELEASE_ASSET_BASENAME=${{ env.PRODUCT_BASENAME }}@${{ matrix.name }}-${{ env.TAG }}
          RELEASE_SRC_DIR=${RELEASE_ASSET_BASENAME}
          RELEASE_ASSET_FILENAME=${RELEASE_ASSET_BASENAME}${{ matrix.archive-ext }}

          mkdir -p "${{ env.JOB_WORKDIR }}/${RELEASE_SRC_DIR}"

          cp "${BUILT_FILE_PATH}" "${{ env.JOB_WORKDIR }}/${RELEASE_SRC_DIR}/"

          echo "RELEASE_SRC_DIR=${RELEASE_SRC_DIR}" >> $GITHUB_ENV
          echo "RELEASE_ASSET_FILENAME=${RELEASE_ASSET_FILENAME}" >> $GITHUB_ENV

      # BSD tar on macOS: first 8MB of the file are sometimes all NUL byte
      # refs: https://github.com/actions/cache/issues/403 , https://github.com/rust-lang/cargo/issues/8603
      - name: Mitigate macOS tar bug
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          sudo /usr/sbin/purge

      - name: Create archive as release asset - Linux
        if: >
          matrix.target != 'aarch64-apple-darwin' &&
          matrix.target != 'x86_64-pc-windows-msvc'
        run: |
          cd "${{ env.JOB_WORKDIR }}"
          tar czf "../${RELEASE_ASSET_FILENAME}" "${RELEASE_SRC_DIR}"

      - name: Create archive as release asset - Windows / macOS
        if: >
          matrix.target == 'aarch64-apple-darwin' ||
          matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          cd "${{ env.JOB_WORKDIR }}"
          7z a "../${RELEASE_ASSET_FILENAME}" "${RELEASE_SRC_DIR}"

      # Handed to the `release` job rather than uploaded directly here: at
      # build time, under Part A's required order, the release does not
      # exist yet. Every matrix leg must succeed before anything is
      # published (owner decision 2).
      - name: Upload release asset archive
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.name }}
          path: ${{ env.RELEASE_ASSET_FILENAME }}

      # [ artifact passed to next workflow(s) ]
      - name: Upload built binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PRODUCT_BASENAME }}-${{ matrix.name }}-${{ env.TAG }}
          path: target/${{ matrix.target }}/release/${{ env.PRODUCT_BASENAME }}${{ matrix.bin-ext }}

  source-archive:
    # Independent of the build matrix's OS/target, so it runs once.
    # Gated the same as `release`: this is packaging, not the asset-variant
    # verification Part C's `workflow_dispatch` proves.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify manifest version matches the tag
        run: |
          # Part F, same check as the build job — this job is already
          # gated to tag pushes only, so no branch-dispatch exemption is
          # needed here.
          MANIFEST_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]*)".*/\1/')
          if [ "${MANIFEST_VERSION}" != "${{ github.ref_name }}" ]; then
            echo "::error::[workspace.package].version (${MANIFEST_VERSION}) does not match the tag (${{ github.ref_name }})"
            exit 1
          fi

      # Mirrors docs/src/dev/release.md exactly: files at archive root, no
      # wrapping directory. GitHub's auto-generated "Source code" links do
      # not satisfy this contract (they wrap in a `<repo>-<sha>/`
      # directory) and must not be substituted for this asset. If this
      # step and the doc ever disagree, the doc is authority.
      - name: Package contract-compliant source archive
        run: |
          ARCHIVE_NAME=${{ env.PRODUCT_BASENAME }}-${{ github.ref_name }}.tar.gz
          tar \
            --exclude='./target' \
            --exclude='./.git' \
            --exclude='./.git-exclude' \
            --exclude='./docs/book' \
            -czf "../${ARCHIVE_NAME}" .
          mv "../${ARCHIVE_NAME}" "${ARCHIVE_NAME}"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Verify archive layout
        run: |
          # Do not pipe `tar tzf` into `head`: this shell runs with
          # `pipefail`, and `head -1` closes its end of the pipe after one
          # line while `tar` still has thousands more entries to write,
          # which fails the pipeline on the resulting EPIPE regardless of
          # what the archive's first entry actually was. Capture the full
          # listing first so `tar`'s stdout is never closed early.
          tar tzf "${{ env.ARCHIVE_NAME }}" > entries.txt
          FIRST_ENTRY=$(head -1 entries.txt)
          if [ "${FIRST_ENTRY}" != "./" ]; then
            echo "::error::Source archive does not have files at root (first entry: ${FIRST_ENTRY})"
            exit 1
          fi

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-source
          path: ${{ env.ARCHIVE_NAME }}

  release:
    # Only a tag push creates and publishes a release. `workflow_dispatch`
    # against a branch is build-verification only (Part C) and must not
    # attempt to upload (§4.5): `github.ref_name` under dispatch is the
    # branch name, not a release-worthy tag.
    if: github.ref_type == 'tag'
    needs: [build, source-archive]
    runs-on: ubuntu-latest
    steps:
      # Checkout must precede the artifact download: actions/checkout
      # clears untracked workspace content by default, and dist/ (where
      # the downloaded assets land) is untracked. Downloading first let
      # checkout silently wipe it, publishing a 0.38.0 release with zero
      # assets (Task 013 Step D incident, review 089).
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all release assets
        uses: actions/download-artifact@v7
        with:
          pattern: release-asset-*
          merge-multiple: true
          path: dist

      - name: Create release if it does not already exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-running after a fix (e.g. an upload retry) must not fail on
          # an already-created release (Part B: idempotent recovery).
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; reusing it."
          # Every tag in this repo is annotated, and the annotation is
          # where the human-written release notes live (e.g. 0.37.0's
          # "Before you upgrade:" block) — --generate-notes only produces
          # an auto-generated commit/PR list and would silently drop that.
          elif git for-each-ref "refs/tags/${{ github.ref_name }}" --format='%(contents)' | grep -q .; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-from-tag
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

      - name: Upload assets to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --clobber: without it, a re-run fails on the first asset that
          # already exists, turning a small failure into a public one.
          gh release upload "${{ github.ref_name }}" dist/* --clobber

      - name: Verify expected asset count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "All variants built" and "all assets attached" are different
          # claims (Part D) — this is the defence against a release that
          # looks complete but silently has fewer assets than it should.
          ACTUAL=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets | length')
          echo "Expected ${{ env.EXPECTED_ASSET_COUNT }} assets, found ${ACTUAL}."
          if [ "${ACTUAL}" -lt "${{ env.EXPECTED_ASSET_COUNT }}" ]; then
            echo "::error::Release ${{ github.ref_name }} is missing assets (${ACTUAL}/${{ env.EXPECTED_ASSET_COUNT }})."
            exit 1
          fi
