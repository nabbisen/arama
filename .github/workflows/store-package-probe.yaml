name: Store Package Probe (Task 038)

# Task 038 / RFC 045 Half A: fast iteration surface for the real MSIX
# packaging job before it is folded into release-executable.yaml.
# workflow_dispatch only — never runs on push, never touches the release
# path, and builds only the one Windows CPU variant this needs rather than
# the full five-way release matrix. Not permanent CI surface: remove once
# the mechanics are proven and ported into release-executable.yaml, the
# same pattern Task 026's msix-capability-probe.yaml used (commit
# b72b09d, removed after its answer was recorded).

on:
  workflow_dispatch:
    inputs:
      break_version_guard:
        description: 'Deliberately commit a non-0.0.0.0 Appx Version to prove the guard fails (Task 038 acceptance criterion). Never combine with a real run.'
        type: boolean
        default: false

defaults:
  run:
    shell: pwsh

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sabotage the committed AppxManifest version (guard-failure proof only)
        if: inputs.break_version_guard == true
        run: |
          (Get-Content packaging/windows/AppxManifest.xml) `
            -replace 'Version="0\.0\.0\.0"', 'Version="0.41.1.0"' |
            Set-Content packaging/windows/AppxManifest.xml
          Get-Content packaging/windows/AppxManifest.xml | Select-String 'Version='

      - name: Verify AppxManifest committed version is the 0.0.0.0 placeholder
        run: |
          [xml]$xml = Get-Content packaging/windows/AppxManifest.xml
          $committed = $xml.Package.Identity.Version
          Write-Host "Committed AppxManifest Version: $committed"
          if ($committed -ne '0.0.0.0') {
            Write-Error "AppxManifest Version must stay 0.0.0.0 in the repository; CI derives it. Found: $committed"
            exit 1
          }

      - name: Install Rust
        shell: bash
        run: bash .github/workflows/scripts/install-rust.sh stable x86_64-pc-windows-msvc

      - name: Build arama.exe (CPU, release)
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --bin arama --locked

      - name: Determine the package version (probe run — no real tag, a fixed test value)
        run: |
          $pkgVersion = "0.0.1.0"
          Write-Host "PACKAGE_VERSION=$pkgVersion"
          "PACKAGE_VERSION=$pkgVersion" >> $env:GITHUB_ENV

      - name: Stage the MSIX payload
        run: |
          New-Item -ItemType Directory -Force -Path msix-staging | Out-Null
          Copy-Item packaging/windows/Assets -Destination msix-staging/Assets -Recurse
          Copy-Item target/x86_64-pc-windows-msvc/release/arama.exe -Destination msix-staging/arama.exe
          [xml]$xml = Get-Content packaging/windows/AppxManifest.xml
          $xml.Package.Identity.Version = $env:PACKAGE_VERSION
          $xml.Save((Join-Path (Resolve-Path msix-staging) "AppxManifest.xml"))
          Get-Content msix-staging/AppxManifest.xml

      - name: Verify the staged manifest version matches the derived version
        run: |
          [xml]$xml = Get-Content msix-staging/AppxManifest.xml
          $staged = $xml.Package.Identity.Version
          if ($staged -ne $env:PACKAGE_VERSION) {
            Write-Error "Staged AppxManifest Version ($staged) does not match derived version ($env:PACKAGE_VERSION)"
            exit 1
          }
          Write-Host "Staged AppxManifest Version matches: $staged"

      - name: RFC 032 check — no ffmpeg/ffprobe in the staged payload
        run: |
          $found = Get-ChildItem -Recurse msix-staging |
            Where-Object { $_.Name -match '(?i)ffmpeg|ffprobe' }
          if ($found) {
            Write-Error "ffmpeg/ffprobe present in staged MSIX payload: $($found.FullName -join ', ')"
            exit 1
          }
          Write-Host "RFC 032: no ffmpeg/ffprobe in staged payload — confirmed."

      - name: Task 037 check — PE subsystem of the staged binary
        id: subsystem
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("msix-staging/arama.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystemOffset = $peOffset + 24 + 68
          $subsystem = [BitConverter]::ToUInt16($bytes, $subsystemOffset)
          Write-Host ("Subsystem: 0x{0:X8} ({1})" -f $subsystem, $(if ($subsystem -eq 2) {"Windows GUI"} elseif ($subsystem -eq 3) {"Windows CUI"} else {"other"}))
          if ($subsystem -ne 2) {
            Write-Error "Expected PE subsystem 2 (Windows GUI) on the staged binary, found $subsystem"
            exit 1
          }

      - name: Locate the Windows SDK's makeappx and signtool
        id: sdk
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $version = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [Version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $version) { Write-Error "No Windows SDK bin directory found under $sdkRoot"; exit 1 }
          $toolsDir = Join-Path $version.FullName "x64"
          $makeappx = Join-Path $toolsDir "makeappx.exe"
          $signtool = Join-Path $toolsDir "signtool.exe"
          if (-not (Test-Path $makeappx)) { Write-Error "makeappx.exe not found at $makeappx"; exit 1 }
          if (-not (Test-Path $signtool)) { Write-Error "signtool.exe not found at $signtool"; exit 1 }
          Write-Host "makeappx: $makeappx"
          Write-Host "signtool: $signtool"
          "makeappx=$makeappx" >> $env:GITHUB_OUTPUT
          "signtool=$signtool" >> $env:GITHUB_OUTPUT

      - name: Package with makeappx
        run: |
          & "${{ steps.sdk.outputs.makeappx }}" pack /d msix-staging /p arama-probe.msix /nv /o
          if ($LASTEXITCODE -ne 0) { Write-Error "makeappx pack failed with exit code $LASTEXITCODE"; exit 1 }
          Get-Item arama-probe.msix

      - name: Create and trust a self-signed certificate matching the manifest Publisher
        run: |
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=C4BA37E8-8670-4C82-8365-5ECB57373921" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Task 038 store-package probe cert" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "probe-dev-cert" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath probe-cert.pfx -Password $pwd | Out-Null
          Import-PfxCertificate -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" -FilePath probe-cert.pfx -Password $pwd | Out-Null
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"

      - name: Sign the package
        run: |
          & "${{ steps.sdk.outputs.signtool }}" sign /fd SHA256 /a /f probe-cert.pfx /p "probe-dev-cert" arama-probe.msix
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool sign failed with exit code $LASTEXITCODE"; exit 1 }

      - name: Ensure sideloading is allowed
        run: |
          $path = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          $before = (Get-ItemProperty -Path $path -Name AllowAllTrustedApps -ErrorAction SilentlyContinue).AllowAllTrustedApps
          Write-Host "AllowAllTrustedApps before: $before"
          New-Item -Path $path -Force | Out-Null
          Set-ItemProperty -Path $path -Name AllowAllTrustedApps -Value 1 -Type DWord
          Write-Host "AllowAllTrustedApps after: $((Get-ItemProperty -Path $path -Name AllowAllTrustedApps).AllowAllTrustedApps)"

      - name: Install the package
        id: install
        run: |
          Add-AppxPackage -Path arama-probe.msix -Verbose
          $pkg = Get-AppxPackage -Name "nabbisen.arama-ai"
          if (-not $pkg) { Write-Error "Package did not install — Get-AppxPackage found nothing"; exit 1 }
          Write-Host "Installed: $($pkg.PackageFullName)"
          "packagefamilyname=$($pkg.PackageFamilyName)" >> $env:GITHUB_OUTPUT

      - name: Launch via AppsFolder and observe RFC 041 data-location evidence
        run: |
          $famName = "${{ steps.install.outputs.packagefamilyname }}"
          Write-Host "Launching shell:AppsFolder\$famName!App"
          Start-Process "shell:AppsFolder\$famName!App"

          $deadline = (Get-Date).AddSeconds(60)
          $found = $null
          while (-not $found -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $found = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter "diagnostic.log" -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $found) {
            Write-Host "No diagnostic.log found under $env:LOCALAPPDATA within 60s."
            Write-Host "--- everything under LOCALAPPDATA named arama* (case-insensitive) ---"
            Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter "*arama*" -ErrorAction SilentlyContinue |
              Select-Object -First 40 FullName
            Write-Error "RFC 041 evidence not found — see listing above."
            exit 1
          }

          Write-Host "Found: $($found.FullName)"
          Write-Host "--- diagnostic.log content ---"
          Get-Content $found.FullName
          Write-Host "--- end diagnostic.log content ---"

          Write-Host "--- process list (arama) ---"
          Get-Process -Name arama -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, Path

      - name: Uninstall the probe package
        if: always()
        run: |
          Get-AppxPackage -Name "nabbisen.arama-ai" | Remove-AppxPackage -ErrorAction SilentlyContinue
